[project]
name = "nexdrop-api"
version = "0.1.0"
description = "NexDrop control-plane API service"
readme = "README.md"
authors = [{ name = "Richnel EGUE", email = "richnelegue@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]
[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.2.0", "pytest-asyncio>=1.4.1.post1", "ruff>=0.17.4"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
